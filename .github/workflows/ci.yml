name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the validator
        run: python3 scripts/validate_findings.py --self-test

      - name: Self-test the orchestrator decision rule
        run: python3 scripts/orchestrate.py --self-test

      - name: Self-test the taint engine normalizers
        run: python3 scripts/taint_engine.py --self-test
